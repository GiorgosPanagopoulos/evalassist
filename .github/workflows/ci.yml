name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install backend dependencies (CI subset, no ML deps)
        run: pip install -r backend/requirements-ci.txt

      - name: Run standalone backend tests
        run: |
          set -e
          for f in backend/tests/test_*.py; do
            echo "=== $f ==="
            python "$f"
          done

      - name: Run RAG evals (isolation_leaks must be 0)
        run: python evals/run_evals.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
